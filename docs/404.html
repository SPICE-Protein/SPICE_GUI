<!doctype html>
<!--
  Cloudflare Pages serves this file for unmatched paths. It must exist: without
  it Pages answers every missing path with a 200 copy of index.html, and docsify
  probes <dir>/_sidebar.md and <dir>/_navbar.md before the root copies. On
  nested pages that probe would then "succeed" with the homepage HTML and be
  rendered as Markdown inside the sidebar and navbar.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page not found · SPICE GUI Documentation</title>
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0e14" />
    <link rel="icon" href="assets/favicon.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0e14;
        color: #e6e9f0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica,
          Arial, sans-serif;
      }
      main {
        max-width: 32rem;
        padding: 2rem 1.5rem;
      }
      img {
        width: 48px;
        height: 48px;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.6;
        color: #a8b0c2;
      }
      a {
        color: #f0a144;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/spice-logo.png" alt="" />
      <h1>Page not found</h1>
      <p>
        This documentation page does not exist, or it moved in a later release.
        Open the manual overview and navigate from there.
      </p>
      <p>
        <a href="/">Documentation overview</a><br />
        <a href="https://github.com/SPICE-Protein/SPICE_GUI">GitHub repository</a>
      </p>
    </main>
  </body>
</html>
