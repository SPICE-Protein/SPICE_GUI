name: build — win x64 · mac arm64 · linux x64/arm64 · android arm64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  # Android APKs are signed via ANDROID_KEYSTORE_* secrets (see android job).
  # Windows code signing / Apple notarization are still unconfigured; once configured,
  # just pass the secret in the matching job — see each job's comment spot.
  CARGO_TERM_COLOR: always
  # The full 7-locale Paraglide catalog (~2700 message modules) pushes the vite build past
  # Node's default heap on the smaller runners — the first full-catalog macOS run died with
  # "Reached heap limit Allocation failed - JavaScript heap out of memory" inside
  # beforeBuildCommand. Raise the V8 old-space cap for every pnpm/node invocation.
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  # ==========================================================================
  # Four desktop targets: all use native-architecture runners, zero cross-compilation.
  #   windows-2022     → x86_64-pc-windows-msvc   (NSIS + MSI)
  #   macos-26         → aarch64-apple-darwin     (Apple Silicon, DMG + .app)
  #   ubuntu-24.04     → x86_64-unknown-linux-gnu  (deb + rpm)
  #   ubuntu-24.04-arm → aarch64-unknown-linux-gnu (deb + rpm)
  # macOS runner must be 26+: binaries linked against the old (14.5) SDK render a
  # permanently blank WKWebView on macOS 26 Tahoe (same bundle, same embedded assets —
  # verified by diffing a macos-14 CI dmg against a local Xcode-26 build: identical
  # Info.plist and asset tables, only LC_BUILD_VERSION sdk differs, only sdk-14.5 goes white).
  # Tahoe changed WebKit behavior for pre-Tahoe-SDK apps; building on macos-26 links
  # SDK 26 and renders correctly. minos stays 11.0, so older macOS is still supported.
  # Both Linux builders must be 24.04+: the static ONNX Runtime that ort 2.0.0-rc.x
  # downloads references glibc ≥ 2.38 (__isoc23_*) and libstdc++ ≥ 14 (_M_replace_cold)
  # symbols; ubuntu-22.04 fails at link time. Consequence: deb/rpm require glibc 2.39
  # at install time (drop a `# min-glibc` note in release pages if it matters).
  # ubuntu-24.04-arm: free for public repos (GA 2025-08); private repos are billed as
  # larger-runner. If you don't want billing, replace this include with the
  # ubuntu-24.04 + qemu-user-static container setup (compilation ~5–10x slower).
  # ==========================================================================
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            bundles: nsis,msi
          - name: macos-arm64
            os: macos-26
            bundles: dmg
          - name: linux-x64
            os: ubuntu-24.04
            bundles: deb,rpm
          - name: linux-arm64
            os: ubuntu-24.04-arm
            bundles: deb,rpm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Gating vars: when the matching secret is unset, the steps below no-op and artifacts stay unsigned.
    env:
      WIN_CERT_PRESENT: ${{ secrets.WINDOWS_CERTIFICATE }}
      AZURE_TENANT_PRESENT: ${{ secrets.AZURE_TENANT_ID }}
      APPLE_CERT_PRESENT: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_APIKEY_PRESENT: ${{ secrets.APPLE_API_KEY_P8_B64 }}
    steps:
      - uses: actions/checkout@v4

      # Linux system deps (webkit2gtk etc.; x64 and arm64 share package names, arch auto-matches)
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          prefix-key: spice-gui

      # ─── Signature injection (secret unset = step auto-skipped) ───────────────────
      - name: Import Windows certificate (pfx route)
        if: matrix.name == 'windows-x64' && env.WIN_CERT_PRESENT != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Path certificate | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item certificate/tempCert.txt
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)

      - name: Install artifact-signing-cli (Azure Trusted Signing route)
        if: matrix.name == 'windows-x64' && env.AZURE_TENANT_PRESENT != ''
        run: cargo install artifact-signing-cli --locked

      - name: Import Apple Developer ID certificate
        if: matrix.name == 'macos-arm64' && env.APPLE_CERT_PRESENT != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_ID=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | awk -F'"' '{print $2}' | head -1)
          test -n "$CERT_ID"
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      - name: Decode App Store Connect API key (notarization)
        if: matrix.name == 'macos-arm64' && env.APPLE_APIKEY_PRESENT != ''
        run: |
          mkdir -p "$RUNNER_TEMP/ci-keys"
          echo "$APPLE_API_KEY_P8_B64" | base64 --decode > "$RUNNER_TEMP/ci-keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/ci-keys/AuthKey.p8" >> "$GITHUB_ENV"
          # Export the Key ID + issuer ONLY when the key exists. Passing them
          # unconditionally from the build step would hand tauri an empty-string
          # env var, which it reads as "notarize me" and then fails.
          echo "APPLE_API_KEY=${{ secrets.APPLE_API_KEY }}" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=${{ secrets.APPLE_API_ISSUER }}" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_P8_B64: ${{ secrets.APPLE_API_KEY_P8_B64 }}

      # AppImage is intentionally excluded: linuxdeploy's runtime download fails intermittently in CI,
      # and deb/rpm cover enough; add it back to the bundles list when needed.
      - name: Tauri build
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
        env:
          # Prerequisites to take effect (tauri.conf.json):
          #  · pfx route    → set certificateThumbprint/digestAlgorithm/timestampUrl under bundle.windows
          #  · Azure route  → bundle.windows.signCommand = "artifact-signing-cli -e https://<region>.codesigning.azure.net -a <account> -c <profile> -d SPICE %1"
          #  · macOS        → bundle.macOS.signingIdentity or APPLE_SIGNING_IDENTITY, which the
          #                   conditional import step above exports into $GITHUB_ENV. Do NOT pass
          #                   APPLE_CERTIFICATE / APPLE_API_KEY here unconditionally: an unset
          #                   secret arrives as an EMPTY STRING, and tauri-cli treats "set at all"
          #                   as "sign now" — it then runs `security import` on nothing and the
          #                   dmg bundling dies with SecKeychainItemImport errors. Unsigned macOS
          #                   builds simply omit these vars (that is the gate working).
          #                   notarization = APPLE_API_KEY(Key ID)+APPLE_API_ISSUER+APPLE_API_KEY_PATH
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spice-gui-${{ matrix.name }}
          # Note: the macOS .app is a directory and upload-artifact only takes files — the DMG already
          # bundles the .app, so it is not uploaded separately.
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: error

  # ==========================================================================
  # Android arm64 (aarch64-linux-android): gen/android is already initialized in the repo
  # (compileSdk 36 / minSdk 24 / AGP 8.11 / Gradle 8.14.3 → JDK 17).
  # Gradle stays on the 8.x line on purpose: AGP 8.11's supported matrix is Gradle 8.13+,
  # and the tauri template's buildSrc/BuildTask.kt calls project.exec{}, which Gradle 9
  # removed outright (compile error in :buildSrc:compileKotlin).
  # Locally verified: cargo check --target aarch64-linux-android is fully green (incl. spice_engine
  # 1.3.11 / ort-sys / mafft / libmsa); ort-sys ships an official prebuilt
  # aarch64-linux-android+nnapi static lib, but it links libc++_shared dynamically — so
  # the NDK's libc++_shared.so must be bundled into jniLibs, otherwise ONNX loading crashes at runtime.
  # With ANDROID_KEYSTORE_* secrets set (they are), the release APK is signed with the
  # project keystore → artifact is app-universal-release.apk (no '-unsigned' suffix).
  # Without the secrets it falls back to the debug key exactly like a local build.
  # ==========================================================================
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: 29.0.13846066
      ANDROID_KEYSTORE_PRESENT: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17 (AGP 8.11 / Gradle 8.14.3)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 ndk;29.0.13846066"

      - name: Rust android target + cargo-ndk
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked --force

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          prefix-key: spice-gui-android
          cache-on-failure: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/**/*.kts', 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ort's prebuilt links libc++_shared.so (dynamic) — bundle it into the APK's arm64 jniLibs.
      # Note the SDK path in the GitHub image: setup-android uses $ANDROID_HOME.
      - name: Bundle NDK libc++_shared.so
        run: |
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          test -d "$NDK" || { echo "::error::NDK not found at $NDK"; ls "$ANDROID_HOME/ndk" || true; exit 1; }
          mkdir -p src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
          cp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
             src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      # Release signing injection: secret unset → don't write keystore.properties → gradle keeps
      # the debug key (behavior identical to local). If set, the conditional signingConfigs
      # in app/build.gradle.kts automatically take over release signing.
      - name: Write keystore.properties (release signing)
        if: env.ANDROID_KEYSTORE_PRESENT != ''
        run: |
          cd src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      # Retry wrapper: the Gradle distribution download (services.gradle.org, or
      # its GitHub-releases mirror depending on which wrapper metadata wins) has
      # intermittently answered HTTP 500 in CI. The first attempt compiles all of
      # Rust; retries only re-enter the gradle phase, so the loop is cheap.
      - name: Tauri android build (arm64 APK)
        run: |
          ok=0
          for i in 1 2 3; do
            if pnpm tauri android build --apk --target aarch64; then ok=1; break; fi
            echo "::warning::android build attempt $i failed (often a transient Gradle-dist 500); retrying in 60s"
            sleep 60
          done
          test "$ok" = "1"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spice-gui-android-arm64-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # ==========================================================================
  # GitHub Release — ONLY on tag push (v*). workflow_dispatch runs stay artifact-only:
  # no release is created for manual builds (the if: below is the whole gate).
  # Artifacts from all five build jobs are flattened into one directory; filenames
  # already carry arch/extension (amd64 vs arm64 deb, x86_64 vs aarch64 rpm, …) so
  # merge-multiple cannot collide. Tags containing '-' (rc/beta) publish as prerelease.
  # ==========================================================================
  release:
    if: github.event_name == 'push'
    needs: [desktop, android-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Annotated tag message IS the release body (git tag -a -m '…'); lightweight
      # tags fall back to the commit message, and an empty result to generated notes.
      # NO actions/checkout: its tag-push fetch breaks on annotated tags
      # ("Cannot fetch both <commit> and refs/tags/<t> to refs/tags/<t>",
      # actions/checkout#1169 — it killed the first v0.0.2 release run), and this
      # job needs no source tree anyway — artifacts come from download-artifact
      # and the tag annotation is read through the git API below.
      - name: Read tag annotation
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OBJ=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object')
          TYPE=$(printf '%s' "$OBJ" | jq -r '.type')
          SHA=$(printf '%s' "$OBJ" | jq -r '.sha')
          if [ "$TYPE" = "tag" ]; then
            MSG=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${SHA}" --jq '.message // ""')
          else
            MSG=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${SHA}" --jq '.message // ""')
          fi
          { printf 'body<<BODYEOF\n%s\nBODYEOF\n' "$MSG"; } >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: spice-gui-*
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SPICE GUI ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: ${{ steps.notes.outputs.body == '' }}
          make_latest: "true"
          prerelease: ${{ contains(github.ref_name, '-') }}
          # RECURSIVE on purpose: download-artifact preserves each artifact's internal
          # bundle/… subdirectory, so files land at artifacts/<arch-dir>/… — the
          # one-level 'artifacts/*' matched only directories and silently uploaded
          # zero assets on the first v0.0.1 release run. Assets upload by basename;
          # filenames already carry arch/extension so nothing collides.
          files: |
            artifacts/**
